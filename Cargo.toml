[package]
name = "mys3"
version = "0.1.0"
edition = "2024"

[lib]
name = "mys3"
path = "src/lib.rs"

[[bin]]
name = "mys3"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "now"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
hex = "0.4.3"
hmac = "0.13.0"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
ureq = "3.4.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
